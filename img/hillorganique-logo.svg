<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <!-- Earth/roots -->
  <path d="M30,170 Q100,155 170,170" stroke="#8B5E3C" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M40,178 Q100,168 160,178" stroke="#5DA9E9" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8"/>
  <!-- Trunk/person -->
  <path d="M100,170 L100,110" stroke="#00574B" stroke-width="10" stroke-linecap="round"/>
  <!-- Arms/branches -->
  <path d="M100,130 L65,105" stroke="#00574B" stroke-width="7" stroke-linecap="round"/>
  <path d="M100,130 L135,105" stroke="#00574B" stroke-width="7" stroke-linecap="round"/>
  <!-- Sun -->
  <circle cx="100" cy="75" r="12" fill="#F5A623"/>
  <!-- Top leaves -->
  <ellipse cx="80" cy="50" rx="10" ry="18" transform="rotate(-25 80 50)" fill="#4CAF50"/>
  <ellipse cx="100" cy="38" rx="9" ry="17" fill="#66BB6A"/>
  <ellipse cx="120" cy="50" rx="10" ry="18" transform="rotate(25 120 50)" fill="#4CAF50"/>
  <!-- Mid leaves -->
  <ellipse cx="62" cy="68" rx="9" ry="16" transform="rotate(-45 62 68)" fill="#8BC34A"/>
  <ellipse cx="138" cy="68" rx="9" ry="16" transform="rotate(45 138 68)" fill="#8BC34A"/>
  <!-- Lower leaves -->
  <ellipse cx="55" cy="92" rx="8" ry="14" transform="rotate(-60 55 92)" fill="#2E7D32"/>
  <ellipse cx="145" cy="92" rx="8" ry="14" transform="rotate(60 145 92)" fill="#2E7D32"/>
  <!-- Small accent leaves -->
  <ellipse cx="72" cy="82" rx="7" ry="12" transform="rotate(-35 72 82)" fill="#66BB6A"/>
  <ellipse cx="128" cy="82" rx="7" ry="12" transform="rotate(35 128 82)" fill="#66BB6A"/>
  <ellipse cx="88" cy="45" rx="7" ry="13" transform="rotate(-10 88 45)" fill="#81C784"/>
  <ellipse cx="112" cy="45" rx="7" ry="13" transform="rotate(10 112 45)" fill="#81C784"/>
  <!-- Bottom dark leaves -->
  <ellipse cx="75" cy="108" rx="7" ry="12" transform="rotate(-70 75 108)" fill="#1B5E20"/>
  <ellipse cx="125" cy="108" rx="7" ry="12" transform="rotate(70 125 108)" fill="#1B5E20"/>
  <!-- Text -->
  <text x="100" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">HillOrganique</text>
</svg>
